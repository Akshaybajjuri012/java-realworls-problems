<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store Catalog</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        header p {
            margin: 5px 0 0;
            color: #555;
        }
        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px;
            flex-wrap: wrap;
        }
        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            width: 250px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }
        .product-card img {
            width: 100%;
            border-radius: 10px;
        }
        .product-card h3 {
            margin: 10px 0 5px;
        }
        .product-card p {
            margin: 5px 0;
            color: #555;
        }
        .price {
            font-weight: bold;
            font-size: 1.2em;
            margin: 10px 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Furniture Store Catalog</h1>
        <p>Find the best furniture for your home</p>
    </header>

    <section class="products">
        <div class="product-card" style="background-color: #f9f9f9;">
            <img src="images/sofa.jpg" alt="Sofa">
            <h3>Sofa</h3>
            <p>Comfortable and stylish sofa</p>
            <div class="price">$499</div>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <div class="product-card">
            <img src="images/diningtable.jpeg" alt="Dining Table">
            <h3>Dining Table</h3>
            <p>Wooden dining table</p>
            <div class="price">$299</div>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <div class="product-card" >
            <img src="images/chair.jpg" alt="Chair">
            <h3 style="color: darkgreen;">chair</h3>
            <p>Modern chair for any room</p>
            <div class="price">$149</div>
            <a href="#" class="btn" >Buy Now</a>
        </div>
    </section>

</body>
</html>
