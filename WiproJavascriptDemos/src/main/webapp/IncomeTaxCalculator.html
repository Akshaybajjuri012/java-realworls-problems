<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Calculator</title>
  <script>
    function calculateTax() {
      let fullName = prompt("Enter your Full Name:");
      let panNumber = prompt("Enter your PAN Number (10 characters, uppercase):");
      let dobInput = prompt("Enter your Date of Birth (YYYY-MM-DD):");
      let annualIncome = parseFloat(prompt("Enter your Annual Income (in ₹):"));

      if (!panNumber || panNumber.length !== 10 || panNumber !== panNumber.toUpperCase()) {
        alert("Invalid PAN format. It must be exactly 10 uppercase characters.");
        return;
      }

      let dob = new Date(dobInput);
      let today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      let monthDiff = today.getMonth() - dob.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
        age--;
      }

      let tax = 0;
      if (annualIncome <= 250000) {
        tax = 0;
      } else if (annualIncome <= 500000) {
        tax = (annualIncome - 250000) * 0.05;
      } else if (annualIncome <= 1000000) {
        tax = (250000 * 0.05) + (annualIncome - 500000) * 0.2;
      } else {
        tax = (250000 * 0.05) + (500000 * 0.2) + (annualIncome - 1000000) * 0.3;
      }

      tax = Math.round(tax);

      let result = 
        `Name: ${fullName.toUpperCase()}\n` +
        `PAN: ${panNumber}\n` +
        `Age: ${age} years\n` +
        `Annual Income: ₹${annualIncome}\n` +
        `Calculated Tax: ₹${tax}`;

      alert(result);
    }
  </script>
</head>
<body onload="calculateTax()">
</body>
</html>
