<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Client</title>
</head>
<body>
<h2>Add New Client</h2>
<form th:action="@{/saveClient}" th:object="${client}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" required><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required><br>

    <label>Phone:</label>
    <input type="text" th:field="*{phone}" required><br>

    <button type="submit">Save</button>
</form>

<br>
<a th:href="@{/}">Back to List</a>
</body>
</html>
