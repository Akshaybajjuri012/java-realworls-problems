<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirupati Temple Darshan Booking Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow p-4 rounded">
                <div class="text-center mb-4">
                    <img src="images/tirupatitemple.jpg" alt="Temple Logo" width="60">
                    <h4 class="fw-bold mt-2">Tirupati Temple Darshan Booking Form</h4>
                </div>

                <form>
          
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
                        <label for="fullName">Full Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                        <label for="email">Email Address</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <div class="input-group">
                            <span class="input-group-text">+91</span>
                            <input type="tel" class="form-control" pattern="[0-9]{10}" placeholder="1234567890" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Gender</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Male" required>
                            <label class="form-check-label">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Female">
                            <label class="form-check-label">Female</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Other">
                            <label class="form-check-label">Other</label>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Darshan Date</label>
                            <input type="date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Darshan Time Slot</label>
                            <select class="form-select" required>
                                <option value="">Select</option>
                                <option>Morning</option>
                                <option>Afternoon</option>
                                <option>Evening</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Number of Tickets</label>
                        <input type="number" class="form-control" min="1" max="10" value="1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Seva Type</label><br>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input">
                            <label class="form-check-label">Archana</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input">
                            <label class="form-check-label">Abhishekam</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input">
                            <label class="form-check-label">Special Entry Darshan</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input">
                            <label class="form-check-label">Suprabhata Seva</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ID Proof Upload 
                            <span data-bs-toggle="tooltip" title="Upload ID proof in JPG, PNG, or PDF format">ℹ</span>
                        </label>
                        <input type="file" class="form-control" accept=".jpg,.jpeg,.png,.pdf" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" rows="2" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-2">Submit</button>
                    <button type="reset" class="btn btn-secondary w-100">Reset</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Enable tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
    })
</script>
</body>
</html>
